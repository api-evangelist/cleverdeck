aid: cleverdeck
name: Cleverdeck
description: >-
  CleverDeck is a spaced-repetition flashcard application for iOS, built by an
  independent developer to help people learn and retain vocabulary and other
  material more efficiently. It ships hand-made premium decks covering roughly
  the 3,000 most common words in major foreign languages — Spanish, French,
  German, Chinese, Japanese, Arabic, Italian, Portuguese, Turkish, Persian,
  Russian and advanced English — with translations, transliterations, images,
  native-speaker audio, and example sentences in both English and the target
  language. The app uses the SM-2 spaced-repetition algorithm (as popularized
  by SuperMemo and Anki) with a customizable learning schedule, cross-device
  sync, and full offline support. It is free to create and study your own
  content, with unlimited access to the premium decks for $3 per month.
  CleverDeck is a consumer mobile product and publishes no public API, SDK,
  developer portal, or agent-facing surface.
